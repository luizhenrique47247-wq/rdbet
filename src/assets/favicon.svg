<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Vibrant Neon Green Gradient -->
    <linearGradient id="neonGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff3c" />
      <stop offset="100%" stop-color="#00b32c" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Background Shape -->
  <rect x="20" y="20" width="472" height="472" rx="120" fill="#0b0d10" stroke="url(#neonGreen)" stroke-width="20" filter="url(#glow)" />
  <!-- RD letters group -->
  <g fill="url(#neonGreen)" filter="url(#glow)">
    <!-- R path -->
    <path d="M100 140 H200 C240 140 260 160 260 195 C260 225 240 245 200 245 H140 V372 H100 V140 Z M140 176 V209 H200 C215 209 220 205 220 195 C220 185 215 176 200 176 H140 Z" />
    <path d="M185 240 L260 372 H210 L140 250 H185 Z" />
    <!-- D path -->
    <path d="M285 140 H360 C410 140 435 180 435 256 C435 332 410 372 360 372 H285 V140 Z M325 178 V334 H360 C390 334 395 305 395 256 C395 207 390 178 360 178 H325 Z" />
  </g>
  <!-- Cyber ring accent -->
  <circle cx="256" cy="256" r="216" fill="none" stroke="#00ff3c" stroke-width="4" stroke-dasharray="15 30" opacity="0.3" />
</svg>